<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/app.css"><title>NaijaHelp MVP</title><script src="js/api.js"></script>
</head><body>
<div id="app"></div><script src="js/app.js"></script>
<div id="api-status" style="position:fixed;bottom:12px;right:12px;z-index:9999;padding:8px 12px;border-radius:999px;background:#111827;color:#fff;font:12px system-ui;opacity:.9">
  API: checking…
</div>
<script>
(async function(){
  const el=document.getElementById('api-status');
  try {
    const r=await fetch((window.NaijaHelpAPI?.apiBase||'http://localhost:4000')+'/health');
    el.textContent=r.ok?'API: connected':'API: unavailable';
  } catch(e){ el.textContent='API: offline (demo mode)'; }
})();
</script>
</body></html>
